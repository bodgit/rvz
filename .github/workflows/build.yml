---
name: Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  golang-checks:
    name: Golang checks
    uses: bodgit/workflows/.github/workflows/golang-checks.yml@dd43086767b331dc0010100dd2a304663999f80a # v1.0.2
    with:
      go_test_args: -v -short
