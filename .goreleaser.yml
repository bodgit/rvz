---
version: 2

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

before:
  hooks:
    - go mod tidy

builds:
  - binary: rvz
    main: ./cmd/rvz/main.go
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
      - windows

checksum:
  name_template: 'checksums.txt'

signs:
  - args: ["-u", "{{ .Env.FINGERPRINT }}", "--output", "${signature}", "--detach-sign", "${artifact}"]
    artifacts: checksum

changelog:
  use: github-native
